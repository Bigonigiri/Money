<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>給料計算</title>

<style>
  :root{
    --bg1:#0b1020;
    --bg2:#111827;
    --card:rgba(17,24,39,.78);
    --card-strong:rgba(24,33,52,.95);
    --text:#f8fafc;
    --muted:#9ca3af;
    --line:rgba(255,255,255,.10);
    --blue:#4f8cff;
    --blue2:#6d5dfc;
    --green:#32d399;
    --red:#ff6b6b;
    --yellow:#fbbf24;
    --shadow:0 20px 60px rgba(0,0,0,.28);
  }

  *{box-sizing:border-box}

  html{
    background:#0b1020;
  }

  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(79,140,255,.22), transparent 35%),
      radial-gradient(circle at 100% 10%, rgba(109,93,252,.20), transparent 30%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    -webkit-tap-highlight-color:transparent;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:24px 24px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:18px 14px 40px;
  }

  h1{
    font-size:28px;
    line-height:1.2;
    margin:8px 4px 18px;
    letter-spacing:-.7px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));
    border:1px solid var(--line);
    border-radius:24px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }

  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    min-height:92px;
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  }

  .stat:first-child{
    background:
      radial-gradient(circle at 100% 0%, rgba(50,211,153,.14), transparent 45%),
      linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  }

  .stat .label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
    font-weight:700;
    letter-spacing:.02em;
  }

  .stat .value{
    font-size:22px;
    font-weight:900;
    letter-spacing:-.5px;
  }

  #totalPay{
    color:var(--green);
    font-size:26px;
  }

  .title{
    font-size:18px;
    font-weight:900;
    letter-spacing:-.35px;
    margin-bottom:2px;
  }

  label{
    display:block;
    font-size:13px;
    color:#cbd5e1;
    margin:13px 0 7px;
    font-weight:700;
  }

  input,select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    color:var(--text);
    background:rgba(8,15,30,.68);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:13px 14px;
    font-size:16px;
    outline:none;
    transition:.18s ease;
  }

  input:focus,select:focus{
    border-color:rgba(79,140,255,.9);
    box-shadow:0 0 0 4px rgba(79,140,255,.14);
  }

  input[type="date"]{
    color-scheme:dark;
  }

  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  button{
    border:0;
    border-radius:15px;
    padding:13px 15px;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
  }

  button:active{
    transform:scale(.985);
    opacity:.88;
  }

  .primary{
    width:100%;
    color:white;
    margin-top:14px;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    box-shadow:0 12px 28px rgba(79,140,255,.28);
  }

  #cancelEditBtn{
    background:rgba(255,255,255,.08)!important;
    color:#e5e7eb!important;
    border:1px solid rgba(255,255,255,.08)!important;
  }

  .danger{
    background:rgba(255,107,107,.10)!important;
    color:#ff8f8f!important;
    border:1px solid rgba(255,107,107,.12)!important;
  }

  .note{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin-top:8px;
  }

  .carry{
    margin-top:13px;
    padding:13px 14px;
    background:linear-gradient(135deg,rgba(251,191,36,.13),rgba(251,191,36,.05));
    border:1px solid rgba(251,191,36,.25);
    border-radius:15px;
    font-size:14px;
    color:#fde68a;
    font-weight:750;
  }

  .segment{
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    padding:12px;
    margin-top:14px;
    background:rgba(7,12,24,.50);
  }

  .segment-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    padding:0 2px;
  }

  .segment-title{
    font-weight:900;
    font-size:15px;
    color:#e5e7eb;
  }

  .segment-remove{
    padding:7px 10px;
    font-size:13px;
    background:rgba(255,107,107,.10);
    color:#ff8f8f;
    border:1px solid rgba(255,107,107,.14);
  }

  .wheel-shell{
    position:relative;
    height:170px;
    border-radius:20px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 48%,rgba(79,140,255,.08),transparent 38%),
      linear-gradient(180deg,#05070c,#090d16);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:inset 0 8px 25px rgba(0,0,0,.55);
  }

  .wheel-shell::before,
  .wheel-shell::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:72px;
    z-index:4;
    pointer-events:none;
  }

  .wheel-shell::before{
    top:0;
    background:linear-gradient(#05070c,rgba(5,7,12,0));
  }

  .wheel-shell::after{
    bottom:0;
    background:linear-gradient(rgba(5,7,12,0),#05070c);
  }

  .wheel-highlight{
    position:absolute;
    left:10px; right:10px;
    top:57px;
    height:56px;
    border-radius:16px;
    background:linear-gradient(135deg,rgba(79,140,255,.22),rgba(109,93,252,.18));
    border:1px solid rgba(116,153,255,.24);
    z-index:1;
    pointer-events:none;
    box-shadow:0 0 28px rgba(79,140,255,.10);
  }

  .wheel-grid{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr;
    height:100%;
  }

  .wheel-col{
    position:relative;
    height:170px;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }

  .wheel-col::-webkit-scrollbar{display:none}
  .wheel-spacer{height:57px}

  .wheel-item{
    height:56px;
    display:flex;
    justify-content:center;
    align-items:center;
    scroll-snap-align:center;
    font-size:23px;
    color:#3f4758;
    font-weight:600;
    user-select:none;
    transition:.12s;
  }

  .wheel-item.active{
    color:white;
    font-size:29px;
    font-weight:900;
    text-shadow:0 0 18px rgba(79,140,255,.35);
  }

  .unit-overlay{
    position:absolute;
    top:57px;
    height:56px;
    z-index:3;
    pointer-events:none;
    color:#dbeafe;
    font-size:15px;
    font-weight:900;
    display:flex;
    align-items:center;
  }

  .u-hour{left:43%}
  .u-min{left:92%}

  .add-segment{
    width:100%;
    margin-top:12px;
    color:#a8c6ff;
    background:rgba(79,140,255,.10);
    border:1px dashed rgba(79,140,255,.42);
    font-size:16px;
  }

  .day-total{
    margin-top:14px;
    padding:16px;
    border-radius:18px;
    background:
      radial-gradient(circle at 100% 0%,rgba(50,211,153,.12),transparent 45%),
      linear-gradient(135deg,rgba(79,140,255,.13),rgba(109,93,252,.08));
    border:1px solid rgba(115,150,255,.22);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }

  .day-total span{
    color:#cbd5e1;
    font-size:13px;
    font-weight:700;
  }

  .day-total strong{
    font-size:22px;
    color:#fff;
    font-weight:950;
    letter-spacing:-.5px;
  }

  .manual-carry{
    margin-top:14px;
    padding:14px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:17px;
    background:rgba(255,255,255,.035);
  }

  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .switch{
    position:relative;
    width:52px;
    height:31px;
    flex:0 0 auto;
  }

  .switch input{display:none}

  .slider{
    position:absolute;
    inset:0;
    background:#394153;
    border-radius:999px;
    transition:.2s;
    border:1px solid rgba(255,255,255,.08);
  }

  .slider:before{
    content:"";
    position:absolute;
    width:25px;height:25px;
    left:2px;top:2px;
    background:white;
    border-radius:50%;
    transition:.2s;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }

  .switch input:checked + .slider{
    background:linear-gradient(135deg,var(--blue),var(--blue2));
  }

  .switch input:checked + .slider:before{
    transform:translateX(21px);
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .item{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    padding:15px;
    background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.025));
  }

  .item::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:3px;
    background:linear-gradient(var(--blue),var(--blue2));
  }

  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }

  .date{
    font-weight:900;
    letter-spacing:-.2px;
  }

  .money{
    font-size:19px;
    font-weight:950;
    color:var(--green);
  }

  .meta{
    font-size:13px;
    color:#aeb8c8;
    line-height:1.7;
    margin-top:9px;
  }

  .actions{
    margin-top:11px;
  }

  .actions button{
    font-size:13px;
    padding:8px 11px;
  }

  .actions button[onclick^="editEntry"]{
    color:#b7ceff!important;
    background:rgba(79,140,255,.10)!important;
    border:1px solid rgba(79,140,255,.16)!important;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:22px;
  }

  #clearBtn{
    border:1px solid rgba(255,107,107,.14)!important;
  }

  @media(max-width:520px){
    .wrap{padding:14px 10px 34px}
    h1{font-size:23px;margin-left:4px}
    .card{border-radius:22px;padding:15px}
    .summary{gap:8px}
    .stat{min-height:88px;padding:13px}
    .stat .value{font-size:20px}
    #totalPay{font-size:24px}
    .row{grid-template-columns:1fr}
    .wheel-item{font-size:24px}
    .wheel-item.active{font-size:29px}
    .unit-overlay{font-size:14px}
    .day-total{
      align-items:flex-start;
      flex-direction:column;
    }
  }
</style>

</head>
<body>
<div class="wrap">
  <h1>💴 給料計算</h1>

  <div class="card">
    <div class="summary">
      <div class="stat"><div class="label">今までの合計給料</div><div class="value" id="totalPay">¥0</div></div>
      <div class="stat"><div class="label">合計勤務時間</div><div class="value" id="totalWorked">0時間0分</div></div>
      <div class="stat"><div class="label">現在の繰越</div><div class="value" id="currentCarry">0分</div></div>
      <div class="stat"><div class="label">登録日数</div><div class="value" id="workDays">0日</div></div>
    </div>
  </div>

  <div class="card">
    <div class="title">設定</div>
    <div class="row">
      <div>
        <label for="hourlyWage">時給（円）</label>
        <input id="hourlyWage" type="number" min="0" inputmode="numeric" placeholder="例：1200">
      </div>
      <div>
        <label for="unit">給与計算単位</label>
        <select id="unit">
          <option value="1">1分単位</option>
          <option value="5">5分単位</option>
          <option value="10">10分単位</option>
          <option value="15">15分単位</option>
          <option value="30">30分単位</option>
          <option value="60" selected>60分単位</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">勤務を追加</div>
    <label for="date">日付</label>
    <input id="date" type="date">

    <div id="segments"></div>

    <button class="add-segment" id="addSegmentBtn">＋ 働いた時間を追加</button>

    <div class="day-total">
      <span>この日の合計（前日の端数込み）</span>
      <strong id="dayTotal">0時間0分</strong>
    </div>

    <div class="carry" id="carryPreview">前日までの繰越：0分</div>

    <div class="manual-carry">
      <div class="switch-row">
        <div>
          <div style="font-weight:800">翌日に回す端数を自分で設定</div>
          <div class="note" style="margin-top:3px">ONにすると翌日の繰越分を指定できます。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="manualCarryToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div id="manualCarryArea" style="display:none">
        <label for="manualCarry">翌日に回す端数（分）</label>
        <input id="manualCarry" type="number" min="0" max="59" inputmode="numeric" value="0">
      </div>
    </div>

    <button class="primary" id="addBtn">この勤務を保存</button>
    <button id="cancelEditBtn" style="display:none;width:100%;margin-top:10px;background:#e5e7eb;color:#374151">編集をキャンセル</button>
  </div>

  <div class="card">
    <div class="title" style="margin-bottom:12px">勤務履歴</div>
    <div id="history" class="list"></div>
    <button class="danger" id="clearBtn" style="width:100%;margin-top:14px">すべての履歴を削除</button>
  </div>
</div>

<script>
const STORAGE_KEY='salaryCalcDataV3';
const SETTINGS_KEY='salaryCalcSettingsV3';
let entries=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{"hourlyWage":"","unit":60}');
let segments=[];
let nextSegmentId=1;
let editingId=null;

const $=id=>document.getElementById(id);
const fmtYen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');

function fmtTimeSeconds(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  if(s) return `${h}時間${m}分${s}秒`;
  return `${h}時間${m}分`;
}
function fmtTimeMinutes(mins){
  mins=Math.max(0,Math.round(mins));
  return `${Math.floor(mins/60)}時間${mins%60}分`;
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function createWheelColumn(max, initial, onChange){
  const col=document.createElement('div');
  col.className='wheel-col';
  const top=document.createElement('div'); top.className='wheel-spacer'; col.appendChild(top);

  for(let i=0;i<=max;i++){
    const item=document.createElement('div');
    item.className='wheel-item';
    item.textContent=i;
    item.dataset.value=i;
    col.appendChild(item);
  }

  const bot=document.createElement('div'); bot.className='wheel-spacer'; col.appendChild(bot);

  let timer=null;
  function update(){
    const v=Math.max(0,Math.min(max,Math.round(col.scrollTop/56)));
    [...col.querySelectorAll('.wheel-item')].forEach(el=>{
      el.classList.toggle('active',Number(el.dataset.value)===v);
    });
    onChange(v);
  }
  col.addEventListener('scroll',()=>{
    update();
    clearTimeout(timer);
    timer=setTimeout(()=>{
      const v=Math.max(0,Math.min(max,Math.round(col.scrollTop/56)));
      col.scrollTo({top:v*56,behavior:'smooth'});
    },80);
  });

  requestAnimationFrame(()=>{
    col.scrollTop=initial*56;
    update();
  });
  return col;
}

function addSegment(initial={hours:0,minutes:0,seconds:0}){
  const id=nextSegmentId++;
  const seg={id,hours:initial.hours||0,minutes:initial.minutes||0,seconds:0};
  segments.push(seg);

  const box=document.createElement('div');
  box.className='segment';
  box.dataset.segmentId=id;

  const head=document.createElement('div');
  head.className='segment-head';
  const title=document.createElement('div');
  title.className='segment-title';
  title.textContent=`勤務時間 ${segments.length}`;
  head.appendChild(title);

  if(segments.length>1){
    const rm=document.createElement('button');
    rm.className='segment-remove';
    rm.textContent='削除';
    rm.onclick=()=>removeSegment(id);
    head.appendChild(rm);
  }
  box.appendChild(head);

  const shell=document.createElement('div');
  shell.className='wheel-shell';

  const hi=document.createElement('div');
  hi.className='wheel-highlight';
  shell.appendChild(hi);

  const grid=document.createElement('div');
  grid.className='wheel-grid';

  const hcol=createWheelColumn(23,seg.hours,v=>{seg.hours=v;updateDayTotal()});
  const mcol=createWheelColumn(59,seg.minutes,v=>{seg.minutes=v;updateDayTotal()});
  grid.append(hcol,mcol);
  shell.appendChild(grid);

  const uh=document.createElement('div');uh.className='unit-overlay u-hour';uh.textContent='時間';
  const um=document.createElement('div');um.className='unit-overlay u-min';um.textContent='分';
  shell.append(uh,um);

  box.appendChild(shell);
  $('segments').appendChild(box);
  refreshSegmentTitles();
  updateDayTotal();
}

function removeSegment(id){
  segments=segments.filter(s=>s.id!==id);
  const el=document.querySelector(`[data-segment-id="${id}"]`);
  if(el) el.remove();
  refreshSegmentTitles();
  updateDayTotal();
}

function refreshSegmentTitles(){
  const boxes=[...document.querySelectorAll('.segment')];
  boxes.forEach((box,i)=>{
    box.querySelector('.segment-title').textContent=`勤務時間 ${i+1}`;
    let rm=box.querySelector('.segment-remove');
    if(segments.length===1 && rm) rm.remove();
    if(segments.length>1 && !rm){
      rm=document.createElement('button');
      rm.className='segment-remove';
      rm.textContent='削除';
      const id=Number(box.dataset.segmentId);
      rm.onclick=()=>removeSegment(id);
      box.querySelector('.segment-head').appendChild(rm);
    }
  });
}

function getDayTotalSeconds(){
  return segments.reduce((sum,s)=>sum+s.hours*3600+s.minutes*60+s.seconds,0);
}
function updateDayTotal(){
  const date=$('date').value;
  const carryMinutes=date ? carryBeforeDate(date) : 0;
  const totalSeconds=getDayTotalSeconds() + carryMinutes*60;
  $('dayTotal').textContent=fmtTimeSeconds(totalSeconds);
}


function segmentFromSeconds(totalSeconds){
  totalSeconds=Math.max(0,Math.round(Number(totalSeconds)||0));
  return {
    hours:Math.floor(totalSeconds/3600),
    minutes:Math.floor((totalSeconds%3600)/60),
    seconds:totalSeconds%60
  };
}

function mergeSameDateEntries(){
  const sorted=[...entries].sort((a,b)=>
    a.date.localeCompare(b.date) || (Number(a.createdAt)||0)-(Number(b.createdAt)||0)
  );
  const grouped=new Map();

  for(const e of sorted){
    const segs=(e.segments&&e.segments.length)
      ? e.segments.map(s=>({
          hours:Number(s.hours)||0,
          minutes:Number(s.minutes)||0,
          seconds:Number(s.seconds)||0
        }))
      : [segmentFromSeconds(e.workedSeconds||0)];

    if(!grouped.has(e.date)){
      grouped.set(e.date,{
        ...e,
        segments:[...segs],
        workedSeconds:segs.reduce((sum,s)=>sum+s.hours*3600+s.minutes*60+s.seconds,0)
      });
    }else{
      const g=grouped.get(e.date);
      g.segments.push(...segs);
      g.workedSeconds=g.segments.reduce((sum,s)=>sum+s.hours*3600+s.minutes*60+s.seconds,0);

      // 同日の端数設定が複数ある場合は、最後に保存された設定を採用
      if((Number(e.createdAt)||0) >= (Number(g.createdAt)||0)){
        g.manualCarryEnabled=!!e.manualCarryEnabled;
        g.manualCarry=Number(e.manualCarry)||0;
        g.createdAt=Number(e.createdAt)||g.createdAt;
      }
    }
  }

  entries=[...grouped.values()];
}

function recalc(){
  mergeSameDateEntries();
  entries.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  let carry=0;

  for(const e of entries){
    const workedMinutes=(e.workedSeconds||0)/60;
    const total=workedMinutes+carry;
    const unit=Number(settings.unit)||1;

    let payableMinutes,carryOut;
    if(e.manualCarryEnabled){
      carryOut=Math.max(0,Math.min(59,Number(e.manualCarry)||0));
      payableMinutes=Math.max(0,total-carryOut);
    }else{
      payableMinutes=Math.floor(total/unit)*unit;
      carryOut=total-payableMinutes;
    }

    e.carryIn=carry;
    e.totalWithCarryMinutes=total;
    e.payableMinutes=payableMinutes;
    e.carryOut=carryOut;
    e.pay=(payableMinutes/60)*(Number(settings.hourlyWage)||0);
    carry=carryOut;
  }
  return carry;
}

function carryBeforeDate(date){
  const sorted=[...entries].filter(e=>e.date<date).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  let carry=0;
  const unit=Number(settings.unit)||1;

  for(const e of sorted){
    const total=(e.workedSeconds||0)/60+carry;
    if(e.manualCarryEnabled){
      carry=Math.max(0,Math.min(59,Number(e.manualCarry)||0));
    }else{
      carry=total-Math.floor(total/unit)*unit;
    }
  }
  return carry;
}

function updateCarryPreview(){
  const d=$('date').value;
  $('carryPreview').textContent=`前日までの繰越：${d?Math.floor(carryBeforeDate(d)):0}分`;
}

function render(){
  const carry=recalc();
  const totalPay=entries.reduce((s,e)=>s+(e.pay||0),0);
  const totalSeconds=entries.reduce((s,e)=>s+(e.workedSeconds||0),0);

  $('totalPay').textContent=fmtYen(totalPay);
  $('totalWorked').textContent=fmtTimeSeconds(totalSeconds);
  $('currentCarry').textContent=`${Math.floor(carry)}分`;
  $('workDays').textContent=`${entries.length}日`;

  const history=$('history');
  if(!entries.length){
    history.innerHTML='<div class="empty">まだ勤務記録がありません</div>';
  }else{
    history.innerHTML=[...entries].reverse().map(e=>{
      const segText=(e.segments||[]).map((s,i)=>`勤務${i+1}：${fmtTimeSeconds(s.hours*3600+s.minutes*60+s.seconds)}`).join('<br>');
      return `
      <div class="item">
        <div class="item-top">
          <div class="date">${e.date}</div>
          <div class="money">${fmtYen(e.pay)}</div>
        </div>
        <div class="meta">
          ${segText}${segText?'<br>':''}
          勤務合計：${fmtTimeSeconds(e.workedSeconds||0)}<br>
          前日から：+${Math.floor(e.carryIn||0)}分<br>
          端数込み合計：${fmtTimeMinutes(e.totalWithCarryMinutes||0)}<br>
          給料計算：${fmtTimeMinutes(e.payableMinutes||0)}<br>
          翌日へ繰越：${Math.floor(e.carryOut||0)}分${e.manualCarryEnabled?'（手動設定）':''}
        </div>
        <div class="actions" style="display:flex;gap:8px">
          <button style="background:#eef2ff;color:#1d4ed8" onclick="editEntry('${e.id}')">編集</button>
          <button class="danger" onclick="removeEntry('${e.id}')">削除</button>
        </div>
      </div>`;
    }).join('');
  }

  updateCarryPreview();
  save();
}


function resetEditor(){
  editingId=null;
  $('segments').innerHTML='';
  segments=[];
  nextSegmentId=1;
  addSegment();
  $('manualCarryToggle').checked=false;
  $('manualCarryArea').style.display='none';
  $('manualCarry').value='0';
  $('addBtn').textContent='この勤務を保存';
  $('cancelEditBtn').style.display='none';
  updateDayTotal();
}

window.editEntry=function(id){
  const e=entries.find(x=>x.id===id);
  if(!e) return;

  editingId=id;
  $('date').value=e.date;

  $('segments').innerHTML='';
  segments=[];
  nextSegmentId=1;

  const savedSegments=(e.segments&&e.segments.length)
    ? e.segments
    : [{hours:Math.floor((e.workedSeconds||0)/3600),
        minutes:Math.floor(((e.workedSeconds||0)%3600)/60),
        seconds:0}];

  savedSegments.forEach(s=>addSegment({
    hours:Number(s.hours)||0,
    minutes:Number(s.minutes)||0,
    seconds:Number(s.seconds)||0
  }));

  $('manualCarryToggle').checked=!!e.manualCarryEnabled;
  $('manualCarryArea').style.display=e.manualCarryEnabled?'block':'none';
  $('manualCarry').value=Number(e.manualCarry)||0;

  $('addBtn').textContent='変更を保存';
  $('cancelEditBtn').style.display='block';
  updateCarryPreview();
  updateDayTotal();

  document.querySelector('.card:nth-of-type(3)').scrollIntoView({behavior:'smooth',block:'start'});
};

window.removeEntry=function(id){
  entries=entries.filter(e=>e.id!==id);
  render();
};

$('addSegmentBtn').addEventListener('click',()=>addSegment());

$('manualCarryToggle').addEventListener('change',()=>{
  $('manualCarryArea').style.display=$('manualCarryToggle').checked?'block':'none';
});

$('addBtn').addEventListener('click',()=>{
  const date=$('date').value;
  const totalSeconds=getDayTotalSeconds();

  if(!date){alert('日付を選んでください');return;}
  if(totalSeconds<=0){alert('働いた時間を設定してください');return;}

  const manualEnabled=$('manualCarryToggle').checked;
  const manualCarry=Number($('manualCarry').value||0);
  if(manualEnabled&&(manualCarry<0||manualCarry>59)){
    alert('端数は0〜59分で入力してください');return;
  }

  const newSegments=segments.map(s=>({
    hours:s.hours,
    minutes:s.minutes,
    seconds:0
  }));

  const data={
    date,
    segments:newSegments,
    workedSeconds:totalSeconds,
    manualCarryEnabled:manualEnabled,
    manualCarry
  };

  if(editingId){
    const index=entries.findIndex(e=>e.id===editingId);
    if(index!==-1){
      const oldDate=entries[index].date;
      entries[index]={
        ...entries[index],
        ...data
      };

      // 編集で別の既存日付へ移した場合も、その日付の履歴へ統合
      mergeSameDateEntries();
    }
  }else{
    // 同じ日の履歴がすでにあるなら、新しい勤務をその日の勤務欄へ追加
    const existing=entries.find(e=>e.date===date);

    if(existing){
      const oldSegments=(existing.segments&&existing.segments.length)
        ? existing.segments
        : [segmentFromSeconds(existing.workedSeconds||0)];

      existing.segments=[...oldSegments,...newSegments];
      existing.workedSeconds=existing.segments.reduce(
        (sum,s)=>sum+(Number(s.hours)||0)*3600+(Number(s.minutes)||0)*60+(Number(s.seconds)||0),
        0
      );

      // 今回入力した端数設定をこの日の最新設定として使う
      existing.manualCarryEnabled=manualEnabled;
      existing.manualCarry=manualCarry;
      existing.createdAt=Date.now();
    }else{
      entries.push({
        id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
        ...data,
        createdAt:Date.now()
      });
    }
  }

  resetEditor();
  render();
});

$('cancelEditBtn').addEventListener('click',()=>{
  resetEditor();
  render();
});

$('hourlyWage').addEventListener('input',()=>{
  settings.hourlyWage=$('hourlyWage').value;
  render();
});
$('unit').addEventListener('change',()=>{
  settings.unit=Number($('unit').value);
  render();
});
$('date').addEventListener('change',()=>{
  updateCarryPreview();
  updateDayTotal();
});
$('clearBtn').addEventListener('click',()=>{
  if(confirm('勤務履歴をすべて削除しますか？')){
    entries=[];
    render();
  }
});

$('hourlyWage').value=settings.hourlyWage??'';
$('unit').value=String(settings.unit??60);
$('date').value=new Date().toLocaleDateString('sv-SE');

addSegment();
render();
</script>
</body>
</html>
