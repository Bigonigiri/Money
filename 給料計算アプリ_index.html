<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>給料計算</title>
<style>
  :root{
    --bg:#f2f4f7; --card:#fff; --text:#111827; --muted:#6b7280;
    --accent:#2563eb; --danger:#dc2626; --line:#e5e7eb; --green:#059669;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:26px;margin:6px 0 16px}
  .card{
    background:var(--card);
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
  }
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{
    background:#f8fafc;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:5px}
  .stat .value{font-size:21px;font-weight:800}
  .title{font-weight:800;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input,select{
    width:100%;
    font-size:16px;
    padding:12px;
    border:1px solid #cfd5dd;
    border-radius:12px;
    background:#fff;
  }
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{
    border:0;
    border-radius:13px;
    padding:13px 14px;
    font-size:16px;
    font-weight:750;
    cursor:pointer;
  }
  .primary{width:100%;background:var(--accent);color:#fff;margin-top:14px}
  .danger{background:#fef2f2;color:var(--danger)}
  .note{font-size:13px;line-height:1.6;color:var(--muted);margin-top:10px}
  .carry{
    margin-top:12px;
    padding:12px;
    background:#fffbeb;
    border:1px solid #fde68a;
    border-radius:12px;
    font-size:14px;
  }

  .picker-wrap{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }
  .picker{
    position:relative;
    height:180px;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    border-radius:16px;
    background:#f8fafc;
    border:1px solid var(--line);
  }
  .picker::-webkit-scrollbar{display:none}
  .picker::before,
  .picker::after{
    content:"";
    display:block;
    height:60px;
  }
  .picker-item{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:650;
    scroll-snap-align:center;
    color:#9ca3af;
    user-select:none;
  }
  .picker-item.active{
    color:#111827;
    font-size:34px;
    font-weight:800;
  }
  .picker-label{
    font-size:17px;
    font-weight:700;
    color:#374151;
  }
  .picker-center{
    position:absolute;
    left:0; right:0;
    top:60px;
    height:60px;
    border-top:1px solid #d1d5db;
    border-bottom:1px solid #d1d5db;
    pointer-events:none;
    background:rgba(255,255,255,.35);
  }
  .picker-holder{position:relative}

  .manual-carry{
    margin-top:12px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#f9fafb;
  }
  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .switch{
    position:relative;
    width:50px;
    height:30px;
    flex:0 0 auto;
  }
  .switch input{display:none}
  .slider{
    position:absolute; inset:0;
    background:#d1d5db;
    border-radius:999px;
    transition:.2s;
  }
  .slider:before{
    content:"";
    position:absolute;
    width:24px;height:24px;
    left:3px;top:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider{background:#22c55e}
  .switch input:checked + .slider:before{transform:translateX(20px)}

  .list{display:flex;flex-direction:column;gap:10px}
  .item{border:1px solid var(--line);border-radius:14px;padding:14px}
  .item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .date{font-weight:800}
  .money{font-weight:800;color:var(--green)}
  .meta{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.55}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{font-size:13px;padding:8px 10px}
  .empty{text-align:center;color:var(--muted);padding:18px}
  @media(max-width:520px){
    .summary,.row{grid-template-columns:1fr}
    .stat .value{font-size:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>💴 給料計算</h1>

  <div class="card">
    <div class="summary">
      <div class="stat">
        <div class="label">今までの合計給料</div>
        <div class="value" id="totalPay">¥0</div>
      </div>
      <div class="stat">
        <div class="label">合計勤務時間</div>
        <div class="value" id="totalWorked">0時間0分</div>
      </div>
      <div class="stat">
        <div class="label">現在の繰越</div>
        <div class="value" id="currentCarry">0分</div>
      </div>
      <div class="stat">
        <div class="label">登録日数</div>
        <div class="value" id="workDays">0日</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">設定</div>
    <div class="row">
      <div>
        <label for="hourlyWage">時給（円）</label>
        <input id="hourlyWage" type="number" min="0" inputmode="numeric" placeholder="例：1200">
      </div>
      <div>
        <label for="unit">給与計算単位</label>
        <select id="unit">
          <option value="1">1分単位</option>
          <option value="5">5分単位</option>
          <option value="10">10分単位</option>
          <option value="15">15分単位</option>
          <option value="30">30分単位</option>
          <option value="60" selected>60分単位</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">勤務を追加</div>

    <label for="date">日付</label>
    <input id="date" type="date">

    <label>働いた時間</label>
    <div class="picker-wrap">
      <div class="picker-holder">
        <div class="picker" id="hoursPicker"></div>
        <div class="picker-center"></div>
      </div>
      <div class="picker-label">時間</div>
      <div class="picker-holder">
        <div class="picker" id="minutesPicker"></div>
        <div class="picker-center"></div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:6px;font-size:14px;color:#6b7280">
      <span style="margin-right:38px">分</span>
    </div>

    <div class="carry" id="carryPreview">前日までの繰越：0分</div>

    <div class="manual-carry">
      <div class="switch-row">
        <div>
          <div style="font-weight:750">端数を自分で設定</div>
          <div class="note" style="margin-top:3px">ONにすると、翌日に回す分数を自分で指定できます。</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="manualCarryToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div id="manualCarryArea" style="display:none">
        <label for="manualCarry">翌日に回す端数（分）</label>
        <input id="manualCarry" type="number" min="0" max="59" inputmode="numeric" value="0">
        <div class="note">例：4時間10分働いた日で「10」と入力すると、その10分を翌日に足します。</div>
      </div>
    </div>

    <button class="primary" id="addBtn">この勤務を追加</button>
  </div>

  <div class="card">
    <div class="title" style="margin-bottom:12px">勤務履歴</div>
    <div id="history" class="list"></div>
    <button class="danger" id="clearBtn" style="width:100%;margin-top:14px">すべての履歴を削除</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'salaryCalcDataV2';
const SETTINGS_KEY = 'salaryCalcSettingsV2';

let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"hourlyWage":"","unit":60}');

const $ = id => document.getElementById(id);
const fmtYen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const fmtTime = mins => `${Math.floor(mins/60)}時間${mins%60}分`;

let selectedHours = 0;
let selectedMinutes = 0;

function makePicker(el, start, end, onChange){
  for(let i=start;i<=end;i++){
    const div=document.createElement('div');
    div.className='picker-item';
    div.textContent=i;
    div.dataset.value=i;
    el.appendChild(div);
  }

  let ticking=false;
  function update(){
    ticking=false;
    const value=Math.round(el.scrollTop/60)+start;
    const clamped=Math.max(start,Math.min(end,value));
    [...el.children].forEach(item=>{
      item.classList.toggle('active',Number(item.dataset.value)===clamped);
    });
    onChange(clamped);
  }

  el.addEventListener('scroll',()=>{
    if(!ticking){
      requestAnimationFrame(update);
      ticking=true;
    }
  });
  setTimeout(update,50);
}

makePicker($('hoursPicker'),0,23,v=>selectedHours=v);
makePicker($('minutesPicker'),0,59,v=>selectedMinutes=v);

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function recalc(){
  entries.sort((a,b)=>a.date.localeCompare(b.date) || a.createdAt-b.createdAt);

  let carry=0;

  for(const e of entries){
    const worked=Number(e.hours)*60+Number(e.minutes);
    const total=worked+carry;
    const unit=Number(settings.unit)||1;

    let payableMinutes, carryOut;

    if(e.manualCarryEnabled){
      carryOut=Math.max(0, Math.min(59, Number(e.manualCarry)||0));
      payableMinutes=Math.max(0,total-carryOut);
    }else{
      payableMinutes=Math.floor(total/unit)*unit;
      carryOut=total-payableMinutes;
    }

    e.workedMinutes=worked;
    e.carryIn=carry;
    e.payableMinutes=payableMinutes;
    e.carryOut=carryOut;
    e.pay=(payableMinutes/60)*(Number(settings.hourlyWage)||0);

    carry=carryOut;
  }
  return carry;
}

function render(){
  const carry=recalc();

  const totalPay=entries.reduce((s,e)=>s+(e.pay||0),0);
  const totalWorked=entries.reduce((s,e)=>s+(e.workedMinutes||0),0);

  $('totalPay').textContent=fmtYen(totalPay);
  $('totalWorked').textContent=fmtTime(totalWorked);
  $('currentCarry').textContent=`${carry}分`;
  $('workDays').textContent=`${entries.length}日`;

  const history=$('history');

  if(!entries.length){
    history.innerHTML='<div class="empty">まだ勤務記録がありません</div>';
  }else{
    history.innerHTML=[...entries].reverse().map(e=>`
      <div class="item">
        <div class="item-top">
          <div class="date">${escapeHtml(e.date)}</div>
          <div class="money">${fmtYen(e.pay)}</div>
        </div>
        <div class="meta">
          実際の勤務：${fmtTime(e.workedMinutes)}<br>
          前日から：+${e.carryIn}分<br>
          給料計算：${fmtTime(e.payableMinutes)}<br>
          翌日へ繰越：${e.carryOut}分${e.manualCarryEnabled ? '（手動設定）' : ''}
        </div>
        <div class="actions">
          <button class="danger" onclick="removeEntry('${e.id}')">削除</button>
        </div>
      </div>
    `).join('');
  }

  updateCarryPreview();
  save();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function carryBeforeDate(date){
  const sorted=[...entries]
    .filter(e=>e.date<date)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);

  let carry=0;
  const unit=Number(settings.unit)||1;

  for(const e of sorted){
    const worked=Number(e.hours)*60+Number(e.minutes);
    const total=worked+carry;

    if(e.manualCarryEnabled){
      carry=Math.max(0,Math.min(59,Number(e.manualCarry)||0));
    }else{
      carry=total-Math.floor(total/unit)*unit;
    }
  }
  return carry;
}

function updateCarryPreview(){
  const date=$('date').value;
  const carry=date?carryBeforeDate(date):0;
  $('carryPreview').textContent=`前日までの繰越：${carry}分`;
}

window.removeEntry=function(id){
  entries=entries.filter(e=>e.id!==id);
  render();
};

$('addBtn').addEventListener('click',()=>{
  const date=$('date').value;

  if(!date){
    alert('日付を選んでください');
    return;
  }

  if(selectedHours===0 && selectedMinutes===0){
    alert('勤務時間を選んでください');
    return;
  }

  const manualEnabled=$('manualCarryToggle').checked;
  const manualCarry=Number($('manualCarry').value||0);

  if(manualEnabled && (manualCarry<0 || manualCarry>59)){
    alert('端数は0〜59分で入力してください');
    return;
  }

  entries.push({
    id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
    date,
    hours:selectedHours,
    minutes:selectedMinutes,
    createdAt:Date.now(),
    manualCarryEnabled:manualEnabled,
    manualCarry:manualCarry
  });

  $('hoursPicker').scrollTo({top:0,behavior:'smooth'});
  $('minutesPicker').scrollTo({top:0,behavior:'smooth'});
  $('manualCarryToggle').checked=false;
  $('manualCarryArea').style.display='none';
  $('manualCarry').value='0';

  render();
});

$('hourlyWage').addEventListener('input',()=>{
  settings.hourlyWage=$('hourlyWage').value;
  render();
});

$('unit').addEventListener('change',()=>{
  settings.unit=Number($('unit').value);
  render();
});

$('date').addEventListener('change',updateCarryPreview);

$('manualCarryToggle').addEventListener('change',()=>{
  $('manualCarryArea').style.display=$('manualCarryToggle').checked?'block':'none';
});

$('clearBtn').addEventListener('click',()=>{
  if(confirm('勤務履歴をすべて削除しますか？')){
    entries=[];
    render();
  }
});

$('hourlyWage').value=settings.hourlyWage??'';
$('unit').value=String(settings.unit??60);
$('date').value=new Date().toLocaleDateString('sv-SE');
render();
</script>
</body>
</html>
